<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - SalesAI</title>

<link rel="stylesheet" href="project.css">

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

</head>


<body class="auth-body">


<div class="auth-container">


    <div class="auth-card">


        <!-- =================================================
             LOGO
        ================================================== -->

        <div class="auth-logo">
            SalesNova
        </div>


        <!-- =================================================
             TITLE
        ================================================== -->

        <h1>
            Create Account
        </h1>


        <p>
            Build smarter sales decisions with AI.
        </p>


        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div
            id="message"
            class="auth-message">
        </div>


        <!-- =================================================
             SIGN UP FORM
        ================================================== -->

        <form id="signupForm">


            <!-- FULL NAME -->

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your full name"
                    required>

            </div>


            <!-- BUSINESS NAME -->

            <div class="form-group">

                <label>
                    Business Name
                </label>

                <input
                    type="text"
                    id="business"
                    placeholder="Enter your business name"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create password"
                        required>


                    <span
                        class="toggle-password"
                        onclick="togglePassword('password', this)">
                        👁
                    </span>

                </div>


                <div class="password-strength">

                    <span id="strengthBar"></span>

                </div>


                <div
                    class="password-text"
                    id="strengthText">

                    Password strength

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label>
                    Confirm Password
                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required>


                    <span
                        class="toggle-password"
                        onclick="togglePassword('confirmPassword', this)">
                        👁
                    </span>

                </div>

            </div>


            <!-- =================================================
                 CREATE ACCOUNT BUTTON
            ================================================== -->

            <button
                type="submit"
                class="auth-btn"
                id="signupBtn">


                <div
                    class="spinner"
                    id="spinner">
                </div>


                <span id="btnText">
                    Create Account
                </span>


            </button>


        </form>


        <!-- =================================================
             LOGIN LINK
        ================================================== -->

        <div class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


    </div>

</div>



<script>


// =========================================================
// SHOW / HIDE PASSWORD
// =========================================================

function togglePassword(id, icon) {

    const input =
        document.getElementById(id);


    if (!input) {
        return;
    }


    if (input.type === "password") {

        input.type = "text";

        icon.innerHTML = "🙈";

    }

    else {

        input.type = "password";

        icon.innerHTML = "👁";

    }

}



// =========================================================
// PASSWORD STRENGTH
// =========================================================

const passwordInput =
    document.getElementById("password");


const strengthBar =
    document.getElementById("strengthBar");


const strengthText =
    document.getElementById("strengthText");


if (passwordInput) {

    passwordInput.addEventListener(
        "input",
        function () {


            const value =
                passwordInput.value;


            let score = 0;


            // At least 8 characters

            if (value.length >= 8) {

                score++;

            }


            // Uppercase

            if (/[A-Z]/.test(value)) {

                score++;

            }


            // Number

            if (/[0-9]/.test(value)) {

                score++;

            }


            // Special character

            if (
                /[!@#$%^&*(),.?":{}|<>]/.test(value)
            ) {

                score++;

            }


            strengthBar.className = "";


            // Empty password

            if (value.length === 0) {

                strengthText.innerHTML =
                    "Password strength";

                return;

            }


            // Weak

            if (score <= 1) {

                strengthBar.classList.add(
                    "weak"
                );

                strengthText.innerHTML =
                    "Weak Password";

            }


            // Medium

            else if (score <= 3) {

                strengthBar.classList.add(
                    "medium"
                );

                strengthText.innerHTML =
                    "Medium Password";

            }


            // Strong

            else {

                strengthBar.classList.add(
                    "strong"
                );

                strengthText.innerHTML =
                    "Strong Password";

            }

        }
    );

}



// =========================================================
// SHOW MESSAGE
// =========================================================

function showMessage(
    type,
    messageText
) {


    const message =
        document.getElementById("message");


    if (!message) {
        return;
    }


    message.className =
        "auth-message";


    if (type === "success") {

        message.classList.add(
            "success-message"
        );

    }

    else {

        message.classList.add(
            "error-message"
        );

    }


    message.innerHTML =
        messageText;


    message.style.display =
        "block";

}



// =========================================================
// SIGN UP
// =========================================================

const signupForm =
    document.getElementById("signupForm");


if (signupForm) {

    signupForm.addEventListener(
        "submit",
        async function (e) {


            e.preventDefault();


            // -------------------------------------------------
            // GET FORM VALUES
            // -------------------------------------------------

            const fullname =
                document
                    .getElementById("fullname")
                    .value
                    .trim();


            const business =
                document
                    .getElementById("business")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            const spinner =
                document.getElementById(
                    "spinner"
                );


            const signupBtn =
                document.getElementById(
                    "signupBtn"
                );


            const btnText =
                document.getElementById(
                    "btnText"
                );


            // -------------------------------------------------
            // HIDE OLD MESSAGE
            // -------------------------------------------------

            const message =
                document.getElementById(
                    "message"
                );


            if (message) {

                message.style.display =
                    "none";

            }


            // =================================================
            // BASIC VALIDATION
            // =================================================

            if (
                fullname === "" ||
                business === "" ||
                email === "" ||
                password === "" ||
                confirmPassword === ""
            ) {

                showMessage(
                    "error",
                    "Please fill in all fields."
                );

                return;

            }


            // =================================================
            // EMAIL VALIDATION
            // =================================================

            const emailPattern =
                /^[A-Za-z0-9._%+-]+@gmail\.com$/i;


            if (!emailPattern.test(email)) {

                showMessage(
                    "error",
                    "Please enter a valid Gmail address."
                );

                return;

            }


            // =================================================
            // PASSWORD MATCH
            // =================================================

            if (
                password !== confirmPassword
            ) {

                showMessage(
                    "error",
                    "Passwords do not match."
                );

                return;

            }


            // =================================================
            // PASSWORD LENGTH
            // =================================================

            if (password.length < 8) {

                showMessage(
                    "error",
                    "Password must contain at least 8 characters."
                );

                return;

            }


            // =================================================
            // START LOADING
            // =================================================

            if (spinner) {

                spinner.style.display =
                    "block";

            }


            if (signupBtn) {

                signupBtn.disabled =
                    true;

            }


            if (btnText) {

                btnText.innerHTML =
                    "Creating Account...";

            }


            // =================================================
            // SEND REQUEST TO FLASK
            // =================================================

            try {


                const response =
                    await fetch(
                        "http://127.0.0.1:5000/register",
                        {

                            method: "POST",

                            credentials: "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                fullname:
                                    fullname,

                                business:
                                    business,

                                email:
                                    email,

                                password:
                                    password

                            })

                        }
                    );


                // =================================================
                // READ SERVER RESPONSE
                // =================================================

                let result = {};


                try {

                    result =
                        await response.json();

                }

                catch (jsonError) {

                    console.log(
                        "Response was not JSON:",
                        jsonError
                    );

                }


                console.log(
                    "Registration response:",
                    response.status,
                    result
                );


                // =================================================
                // SUCCESS
                // =================================================

                if (
                    response.ok &&
                    response.status >= 200 &&
                    response.status < 300
                ) {


                    if (spinner) {

                        spinner.style.display =
                            "none";

                    }


                    if (btnText) {

                        btnText.innerHTML =
                            "Account Created";

                    }


                    showMessage(
                        "success",
                        "Registration successful! Redirecting to login..."
                    );


                    /*
                     * IMPORTANT:
                     *
                     * Your frontend is running on:
                     *
                     * http://127.0.0.1:5500
                     *
                     * Therefore we use the exact login URL.
                     *
                     * No setTimeout.
                     * No relative-path ambiguity.
                     */

                    window.location.href =
                        "http://127.0.0.1:5500/login.html";


                    return;

                }


                // =================================================
                // REGISTRATION FAILED
                // =================================================

                if (spinner) {

                    spinner.style.display =
                        "none";

                }


                if (signupBtn) {

                    signupBtn.disabled =
                        false;

                }


                if (btnText) {

                    btnText.innerHTML =
                        "Create Account";

                }


                showMessage(
                    "error",
                    result.error ||
                    "Registration failed. Please try again."
                );

            }


            // =================================================
            // CONNECTION ERROR
            // =================================================

            catch (error) {


                console.error(
                    "Registration error:",
                    error
                );


                if (spinner) {

                    spinner.style.display =
                        "none";

                }


                if (signupBtn) {

                    signupBtn.disabled =
                        false;

                }


                if (btnText) {

                    btnText.innerHTML =
                        "Create Account";

                }


                showMessage(
                    "error",
                    "Unable to connect to the server. Make sure your Flask backend is running."
                );

            }

        }
    );

}


</script>


</body>

</html>
